<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>LeSacAEthique — configuration</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f5f8fa;color:#13222e;display:grid;place-items:center;min-height:100vh}
.c{background:#fff;border:1px solid #d6e0e7;border-radius:12px;padding:28px;width:min(440px,92vw)}
h1{font-size:1.3rem;margin:0 0 6px;color:#0b3d5c} input{font:inherit;width:100%;padding:10px 12px;border:1px solid #d6e0e7;border-radius:10px;margin:8px 0 14px;box-sizing:border-box}
button{font:inherit;font-weight:600;background:#0b3d5c;color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer} .e{color:#b3261e;min-height:1.5em}
img{width:72px;height:72px}
</style></head><body><form class="c" id="f">
<img src="icon.png" alt=""><h1>LeSacAEthique</h1><p>Indiquez l’adresse du serveur du CER-PROMEDNAV, fournie par l’administrateur.</p>
<label for="u">Adresse du serveur</label><input id="u" type="url" placeholder="https://cer.promednav.fr" required autofocus>
<p class="e" id="e"></p><button>Se connecter</button></form>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = await window.lesacaDesktop.setServer(document.getElementById('u').value);
  document.getElementById('e').textContent = err || '';
});
</script></body></html>
