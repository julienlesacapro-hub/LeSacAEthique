# Déploiement sur le serveur de l'association : application + proxy HTTPS (Caddy,
# certificat Let's Encrypt automatique). Lancer depuis la racine du dépôt :
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: { DATA_DIR: /data, KEYS_DIR: /keys, HOST: 0.0.0.0, PORT: "8443", TRUST_PROXY: "1" }
    volumes:
      - lesaca-data:/data
      - lesaca-keys:/keys
    expose: ["8443"]
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  lesaca-data:
  lesaca-keys:
  caddy-data:
